<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Labour Staff · LabourPro</title>
<link rel="stylesheet" href="css/tokens.css" /><link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" /><link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="app-shell">
  <div id="shell-root"></div>
  <div class="main" id="main">
    <main class="content">
      <div id="devBanner"></div>
      <div class="page-header">
        <div><h1>Labour Staff</h1><div class="sub">Registration, verification, wage configuration and biometric enrollment for every worker across your network.</div></div>
        <div class="page-header-actions">
          <button class="btn btn-secondary" id="seedBtn">Load development data</button>
          <button class="btn btn-primary" id="addStaffBtn">Register staff</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-body no-pad" id="tableRoot"></div>
      </div>
    </main>
  </div>
</div>

<div class="drawer-scrim" id="drawerScrim"><div class="drawer" id="drawer"></div></div>

<script type="module">
import { mountShell, devModeBanner } from './js/components/shell.js';
import { api } from './js/services/api.js';
import { icon } from './js/components/icons.js';
import { createDataTable } from './js/components/table.js';
import { toast } from './js/components/toast.js';
mountShell();

const catBadge = { SKILLED:'accent', SEMI_SKILLED:'info', UNSKILLED:'neutral' };
const statusBadge = { ACTIVE:'success', PENDING_APPROVAL:'warning', INACTIVE:'neutral', BLACKLISTED:'error' };

let vendors=[], warehouses=[];

async function boot(){
  document.getElementById('devBanner').innerHTML = devModeBanner();
  const [staff, v, w] = await Promise.all([api.listStaff(), api.listVendors(), api.listWarehouses()]);
  vendors=v; warehouses=w;
  document.getElementById('seedBtn').style.display = staff.length ? 'none':'';

  createDataTable(document.getElementById('tableRoot'), {
    selectable:true,
    columns:[
      { key:'name', label:'Staff', sortable:true, render:r=> `<div><b>${r.name}</b><div class="cell-sub mono">${r.id}</div></div>` },
      { key:'category', label:'Category', sortable:true, render:r=> `<span class="badge badge-${catBadge[r.category]}">${r.category.replace('_',' ')}</span>` },
      { key:'vendorId', label:'Vendor', render:r=> vendorName(r.vendorId) },
      { key:'warehouseId', label:'Warehouse', render:r=> whName(r.warehouseId) },
      { key:'deployment', label:'Deployment', render:r=> `<span class="badge badge-neutral">${r.deployment.replace('_',' ')}</span>` },
      { key:'dailyWage', label:'Daily Wage', sortable:true, render:r=> `<span class="mono">₹${r.dailyWage}</span>` },
      { key:'biometricEnrolled', label:'Biometric', render:r=> r.biometricEnrolled ? `<span class="badge badge-success">${icon('fingerprint')} Enrolled</span>`:`<span class="badge badge-warning">Pending</span>` },
      { key:'status', label:'Status', sortable:true, render:r=> `<span class="badge badge-${statusBadge[r.status]}">${r.status.replace('_',' ')}</span>` },
    ],
    rows: staff, getId:r=>r.id, pageSize:12, searchKeys:['name','id'],
    filters:[
      { key:'category', label:'Category', options:[{value:'SKILLED',label:'Skilled'},{value:'SEMI_SKILLED',label:'Semi-Skilled'},{value:'UNSKILLED',label:'Unskilled'}] },
      { key:'status', label:'Status', options:[{value:'ACTIVE',label:'Active'},{value:'PENDING_APPROVAL',label:'Pending Approval'},{value:'INACTIVE',label:'Inactive'},{value:'BLACKLISTED',label:'Blacklisted'}] },
    ],
    bulkActions:[
      { label:'Activate', onClick:(rows)=> toast.show({type:'success', title:`${rows.length} staff activated`}) },
      { label:'Deactivate', onClick:(rows)=> toast.show({type:'warning', title:`${rows.length} staff deactivated`}) },
    ],
    onRowClick: openProfile,
    emptyState:{ icon:'users', title:'No staff records yet', desc:'Register your workforce or load development data to preview this workspace.' },
  });
}

function vendorName(id){ const v = vendors.find(x=>x.id===id); return v ? v.name : '—'; }
function whName(id){ const w = warehouses.find(x=>x.id===id); return w ? w.code : '—'; }

function openProfile(staff){
  const scrim = document.getElementById('drawerScrim');
  const drawer = document.getElementById('drawer');
  drawer.innerHTML = `
    <div class="drawer-head">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="avatar" style="width:40px;height:40px;font-size:14px;">${staff.name.split(' ').map(n=>n[0]).join('')}</div>
        <div><h3 style="font-size:16px;">${staff.name}</h3><div class="cell-sub mono">${staff.id}</div></div>
      </div>
      <button class="icon-btn" id="closeDrawer">${icon('x')}</button>
    </div>
    <div class="drawer-body">
      <div class="tabs mb-16" id="profileTabs">
        ${['Identity','Employment','Compensation','Attendance','Biometric','Documents','Compliance','Activity'].map((t,i)=>`<div class="tab ${i===0?'active':''}" data-tab="${t}">${t}</div>`).join('')}
      </div>
      <div id="tabContent"></div>
    </div>
    <div class="drawer-foot">
      <button class="btn btn-secondary" id="cancelDrawer">Close</button>
      <button class="btn btn-primary">Save changes</button>
    </div>`;
  scrim.classList.add('show'); drawer.classList.add('show');
  document.getElementById('closeDrawer').onclick = close;
  document.getElementById('cancelDrawer').onclick = close;
  scrim.onclick = (e)=>{ if(e.target===scrim) close(); };

  const panels = {
    Identity: `
      <div class="card-grid" style="grid-template-columns:1fr 1fr;">
        ${field('Full name', staff.name)}${field('Biometric ID', staff.biometricId)}
        ${field('Category', staff.category.replace('_',' '))}${field('Deployment', staff.deployment.replace('_',' '))}
        ${field('Verification', staff.verified ? 'Verified':'Pending')}${field('Status', staff.status.replace('_',' '))}
      </div>`,
    Employment: `<div class="card-grid" style="grid-template-columns:1fr 1fr;">${field('Vendor', vendorName(staff.vendorId))}${field('Warehouse', whName(staff.warehouseId))}${field('Deployment type', staff.deployment.replace('_',' '))}${field('Employment status', staff.status.replace('_',' '))}</div>`,
    Compensation: `<div class="card-grid" style="grid-template-columns:1fr 1fr;">${field('Daily wage', '₹'+staff.dailyWage)}${field('Service charge basis', '18% of base wage')}${field('Overtime eligible', 'Yes, beyond 9 hrs/day')}${field('Wage lock', 'Unlocked — editable')}</div>`,
    Attendance: `<div class="state-block" style="padding:30px 10px;"><div class="state-icon">${icon('clock')}</div><h3>Attendance history</h3><p>Open the Attendance Records module filtered to this worker to review punches.</p><a class="btn btn-secondary btn-sm" href="attendance-records.html" style="margin-top:8px;">Go to Attendance Records</a></div>`,
    Biometric: `
      <div class="flex-between mb-16">
        <span class="badge badge-${staff.biometricEnrolled?'success':'warning'}">${staff.biometricEnrolled?'Enrolled':'Not enrolled'}</span>
        <a class="btn btn-secondary btn-sm" href="biometric-enrollment.html">${icon('fingerprint')} ${staff.biometricEnrolled?'Re-enroll':'Enroll now'}</a>
      </div>
      <p class="text-tertiary" style="font-size:var(--fs-xs);">Enrollment registers this worker's biometric identifier on assigned warehouse devices via the device gateway.</p>`,
    Documents: `<div class="state-block" style="padding:30px 10px;"><div class="state-icon">${icon('fileText')}</div><h3>No documents uploaded</h3><p>ID proof, address proof and vendor-issued documents will appear here.</p></div>`,
    Compliance: `<div class="state-block" style="padding:30px 10px;"><div class="state-icon">${icon('shield')}</div><h3>No compliance flags</h3><p>This worker has no open compliance issues.</p></div>`,
    Activity: `<div class="state-block" style="padding:30px 10px;"><div class="state-icon">${icon('history')}</div><h3>No recent activity</h3><p>Profile edits and approval events will be logged here.</p></div>`,
  };
  function field(label, val){ return `<div class="field"><label>${label}</label><div class="input" style="display:flex;align-items:center;background:rgba(255,255,255,0.02);">${val}</div></div>`; }
  const setTab = (t)=> document.getElementById('tabContent').innerHTML = panels[t];
  setTab('Identity');
  drawer.querySelectorAll('.tab').forEach(tab=> tab.addEventListener('click', ()=>{
    drawer.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); tab.classList.add('active'); setTab(tab.dataset.tab);
  }));
  function close(){ scrim.classList.remove('show'); drawer.classList.remove('show'); }
}

document.getElementById('addStaffBtn').addEventListener('click', ()=> toast.show({type:'info', title:'Staff registration form', msg:'Multi-step registration form — wire to POST /api/staff when a backend is connected.'}));
document.getElementById('seedBtn').addEventListener('click', async ()=>{ await api.seedDevData(); toast.show({type:'success', title:'Development data loaded'}); boot(); });

boot();
</script>
</body>
</html>
