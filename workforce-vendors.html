<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Labour Vendors · LabourPro</title>
<link rel="stylesheet" href="css/tokens.css" /><link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" /><link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="app-shell">
  <div id="shell-root"></div>
  <div class="main" id="main">
    <main class="content">
      <div id="devBanner"></div>
      <div class="page-header">
        <div><h1>Labour Vendors</h1><div class="sub">Contract, compliance and cost posture for every labour supplier in your network.</div></div>
        <div class="page-header-actions">
          <button class="btn btn-secondary" id="seedBtn">Load development data</button>
          <button class="btn btn-primary">${''}Onboard vendor</button>
        </div>
      </div>
      <div class="panel"><div class="panel-body no-pad" id="tableRoot"></div></div>
    </main>
  </div>
</div>
<div class="drawer-scrim" id="drawerScrim"><div class="drawer" id="drawer" style="width:min(680px,96vw);"></div></div>

<script type="module">
import { mountShell, devModeBanner } from './js/components/shell.js';
import { api } from './js/services/api.js';
import { icon } from './js/components/icons.js';
import { createDataTable } from './js/components/table.js';
import { toast } from './js/components/toast.js';
mountShell();

let warehouses = [];
const statusTone = { ACTIVE:'success', ONBOARDING:'info', SUSPENDED:'warning', BLACKLISTED:'error' };
const compTone = { COMPLIANT:'success', PENDING:'warning', EXPIRED:'error' };
const ctrTone = { ACTIVE:'success', EXPIRING:'warning', EXPIRED:'error', NONE:'neutral' };

async function boot(){
  document.getElementById('devBanner').innerHTML = devModeBanner();
  const [vendors, w] = await Promise.all([api.listVendors(), api.listWarehouses()]);
  warehouses = w;
  document.getElementById('seedBtn').style.display = vendors.length ? 'none':'';

  createDataTable(document.getElementById('tableRoot'), {
    columns:[
      { key:'name', label:'Vendor', sortable:true, render:r=> `<div><b>${r.name}</b><div class="cell-sub mono">${r.code} · ${r.gstin}</div></div>` },
      { key:'warehouseIds', label:'Warehouses', render:r=> r.warehouseIds.map(id=> warehouses.find(w=>w.id===id)?.code).filter(Boolean).join(', ') || '—' },
      { key:'status', label:'Status', sortable:true, render:r=> `<span class="badge badge-${statusTone[r.status]}">${r.status}</span>` },
      { key:'complianceStatus', label:'Compliance', render:r=> `<span class="badge badge-${compTone[r.complianceStatus]}">${r.complianceStatus}</span>` },
      { key:'contractStatus', label:'Contract', render:r=> `<span class="badge badge-${ctrTone[r.contractStatus]}">${r.contractStatus}</span>` },
      { key:'workforceCount', label:'Workforce', sortable:true },
      { key:'monthlyCost', label:'Monthly Cost', sortable:true, render:r=> `<span class="mono">₹${r.monthlyCost.toLocaleString('en-IN')}</span>` },
    ],
    rows: vendors, getId:r=>r.id, pageSize:10, searchKeys:['name','code'],
    filters:[
      { key:'status', label:'Status', options:[{value:'ACTIVE',label:'Active'},{value:'ONBOARDING',label:'Onboarding'},{value:'SUSPENDED',label:'Suspended'},{value:'BLACKLISTED',label:'Blacklisted'}] },
      { key:'complianceStatus', label:'Compliance', options:[{value:'COMPLIANT',label:'Compliant'},{value:'PENDING',label:'Pending'},{value:'EXPIRED',label:'Expired'}] },
    ],
    onRowClick: openVendor,
    emptyState:{ icon:'truck', title:'No vendors yet', desc:'Onboard a labour vendor or load development data to preview this workspace.' },
  });
}

function openVendor(v){
  const scrim = document.getElementById('drawerScrim'), drawer = document.getElementById('drawer');
  drawer.innerHTML = `
    <div class="drawer-head">
      <div><h3 style="font-size:16px;">${v.name}</h3><div class="cell-sub mono">${v.code} · ${v.gstin}</div></div>
      <button class="icon-btn" id="closeDrawer">${icon('x')}</button>
    </div>
    <div class="drawer-body">
      <div class="tabs mb-16" id="vTabs">${['Overview','Labour','Contracts','Compliance','Documents','Purchase Orders','Billable Schedules','Invoices','Activity'].map((t,i)=>`<div class="tab ${i===0?'active':''}" data-tab="${t}">${t}</div>`).join('')}</div>
      <div id="vTabContent"></div>
    </div>
    <div class="drawer-foot"><button class="btn btn-secondary" id="cancelDrawer">Close</button></div>`;
  scrim.classList.add('show'); drawer.classList.add('show');
  const close=()=>{ scrim.classList.remove('show'); drawer.classList.remove('show'); };
  document.getElementById('closeDrawer').onclick = close; document.getElementById('cancelDrawer').onclick = close;
  scrim.onclick = (e)=>{ if(e.target===scrim) close(); };

  const linkPanel = (label, icon_, href) => `<div class="state-block" style="padding:28px 10px;"><div class="state-icon">${icon(icon_)}</div><h3>${label}</h3><p>Open the dedicated module for full detail on this vendor.</p><a class="btn btn-secondary btn-sm" href="${href}" style="margin-top:8px;">Open ${label}</a></div>`;

  const panels = {
    Overview: `<div class="card-grid" style="grid-template-columns:1fr 1fr;">
      ${field('Status', v.status)}${field('Compliance status', v.complianceStatus)}
      ${field('Contract status', v.contractStatus)}${field('Workforce count', v.workforceCount)}
      ${field('Monthly cost', '₹'+v.monthlyCost.toLocaleString('en-IN'))}${field('Warehouses', v.warehouseIds.map(id=>warehouses.find(w=>w.id===id)?.code).join(', ')||'—')}
    </div>`,
    Labour: linkPanel('Labour Staff','users','workforce-staff.html'),
    Contracts: linkPanel('Contracts','scroll','governance-contracts.html'),
    Compliance: linkPanel('Compliance','shield','governance-compliance.html'),
    Documents: `<div class="state-block" style="padding:28px 10px;"><div class="state-icon">${icon('fileText')}</div><h3>No documents uploaded</h3><p>GST certificates, PF/ESIC filings and agreements will appear here.</p></div>`,
    'Purchase Orders': linkPanel('Service POs','fileText','procurement-pos.html'),
    'Billable Schedules': linkPanel('Monthly Billable Schedule','scroll','procurement-billable.html'),
    Invoices: linkPanel('Vendor Invoices','receipt','procurement-invoices.html'),
    Activity: `<div class="state-block" style="padding:28px 10px;"><div class="state-icon">${icon('history')}</div><h3>No recent activity</h3><p>Vendor-level changes and approvals will be logged here.</p></div>`,
  };
  function field(label,val){ return `<div class="field"><label>${label}</label><div class="input" style="display:flex;align-items:center;background:rgba(255,255,255,0.02);">${val}</div></div>`; }
  const setTab = t=> document.getElementById('vTabContent').innerHTML = panels[t];
  setTab('Overview');
  drawer.querySelectorAll('.tab').forEach(tab=> tab.addEventListener('click', ()=>{ drawer.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); tab.classList.add('active'); setTab(tab.dataset.tab); }));
}

document.getElementById('seedBtn').addEventListener('click', async ()=>{ await api.seedDevData(); toast.show({type:'success', title:'Development data loaded'}); boot(); });
boot();
</script>
</body>
</html>
