<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Overtime · LabourPro</title>
<link rel="stylesheet" href="css/tokens.css" /><link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" /><link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="app-shell">
  <div id="shell-root"></div>
  <div class="main" id="main">
    <main class="content">
      <div id="devBanner"></div>
      <div class="page-header">
        <div><h1>Overtime</h1><div class="sub">Staff exceeding configured working hours, with payment or comp-off resolution.</div></div>
        <button class="btn btn-secondary" id="seedBtn">Load development data</button>
      </div>
      <div class="panel"><div class="panel-body no-pad" id="tableRoot"></div></div>
    </main>
  </div>
</div>

<script type="module">
import { mountShell, devModeBanner } from './js/components/shell.js';
import { api } from './js/services/api.js';
import { icon } from './js/components/icons.js';
import { createDataTable } from './js/components/table.js';
import { toast } from './js/components/toast.js';
mountShell();

const statusTone = { PENDING:'warning', APPROVED:'info', PAID:'success' };

async function boot(){
  document.getElementById('devBanner').innerHTML = devModeBanner();
  const [ot, staff] = await Promise.all([api.listOvertime(), api.listStaff()]);
  document.getElementById('seedBtn').style.display = ot.length ? 'none':'';
  const rows = ot.map(o=>({ ...o, staffName: staff.find(s=>s.id===o.staffId)?.name||'Unknown' }));
  createDataTable(document.getElementById('tableRoot'), {
    columns:[
      { key:'staffName', label:'Staff', sortable:true, render:r=> `<div><b>${r.staffName}</b><div class="cell-sub mono">${r.staffId}</div></div>` },
      { key:'date', label:'Date', sortable:true, render:r=> new Date(r.date).toLocaleDateString() },
      { key:'regularHrs', label:'Regular', render:r=> r.regularHrs+'h' },
      { key:'actualHrs', label:'Actual', sortable:true, render:r=> r.actualHrs+'h' },
      { key:'extraHrs', label:'Extra', sortable:true, render:r=> `<b class="mono">${r.extraHrs}h</b>` },
      { key:'compensationType', label:'Compensation', render:r=> `<span class="badge badge-neutral">${r.compensationType.replace('_',' ')}</span>` },
      { key:'status', label:'Status', sortable:true, render:r=> `<span class="badge badge-${statusTone[r.status]}">${r.status}</span>` },
    ],
    rows, getId:r=>r.id, pageSize:12, searchKeys:['staffName'],
    filters:[{ key:'status', label:'Status', options:['PENDING','APPROVED','PAID'].map(v=>({value:v,label:v})) }],
    bulkActions:[{ label:'Approve', onClick:(rs)=> toast.show({type:'success', title:`${rs.length} overtime records approved`}) }],
    selectable:true,
    emptyState:{ icon:'clock', title:'No overtime recorded', desc:'Staff exceeding configured working hours will appear here.' },
  });
}
document.getElementById('seedBtn').addEventListener('click', async ()=>{ await api.seedDevData(); toast.show({type:'success', title:'Development data loaded'}); boot(); });
boot();
</script>
</body>
</html>
